- id: MEM-2026-0001
  insight: 繁中 Gherkin（# language: zh-TW）的 Rule 區塊關鍵字沒有翻譯，要寫英文「Rule:」；寫「規則:」不會報錯，但會被當成上一層的描述文字。
  category: pitfall
  confidence: 0.9
  created_at: 2026-10-06
  context: 撰寫 backend/tests/TcmClinic.Api.AcceptanceTests/**/*.feature（Reqnroll 3.3.4，內含 Gherkin 35.0.0；2026-10-09 前位於 FunctionalTests/Features/）時，用 Rule 分組場景並各自帶背景。
  anti_pattern: 第一個「規則:」被吞進 Feature 描述，直到第二個「規則:」後面接「背景:」才在建置時報錯（expected #RuleLine … got '規則: …'），容易誤判成背景寫錯。
  resolution: 寫「Rule:」；其餘關鍵字照常用繁中（功能、背景、場景、場景大綱、例子、假設、當、那麼、而且）。zh-CN 方言才有「规则」。
  example:
    bad: "  規則: 停用的帳號不能登入"
    good: "  Rule: 停用的帳號不能登入"
  tags: [gherkin, reqnroll, bdd, zh-TW]
  applicability:
    frameworks: [Reqnroll, Gherkin]
    universal: false
  validity:
    type: versioned
    version_bound: "Gherkin 35.0.0"
  related: []
- id: MEM-2026-0002
  insight: 原始碼資料夾不要取名 Build（或 build、bin、obj 等建置輸出名稱）——根目錄 .gitignore 的「build/」在 Windows（core.ignorecase=true）會不分大小寫排除整個資料夾，新檔不會出現在 git status。
  category: pitfall
  confidence: 0.95
  created_at: 2026-10-08
  context: SPEC-065 新增 backend/src/TcmClinic.Api.Web/Endpoints/Build/ 放 BuildInfo 與 GetVersionEndpoint。
  anti_pattern: 本機建置與三層測試全綠、git add -A 也沒報錯，但兩個檔根本沒進 commit；乾淨 clone 會編譯失敗。審查時才以 git check-ignore 發現。
  resolution: 資料夾改名（如 BuildIdentity）。新增資料夾後以 git status 確認新檔有列出；有疑慮時用 git check-ignore -v <路徑> 查是哪條規則命中。合併前可用 git -c core.longpaths=true clone 到短路徑（如 %TEMP%\c065）重跑建置確認。
  example:
    bad: "backend/src/TcmClinic.Api.Web/Endpoints/Build/BuildInfo.cs"
    good: "backend/src/TcmClinic.Api.Web/Endpoints/BuildIdentity/BuildInfo.cs"
  tags: [git, gitignore, windows]
  applicability:
    universal: true
  validity:
    type: permanent
  related: []
- id: MEM-2026-0003
  insight: Reqnroll 的 hook（[BeforeFeature]、[AfterScenario] 等）預設套用到所有 feature；每個步驟類別都要在類別上加 [Scope(Feature = "功能名稱")]，否則新增 feature 時別的類別的工廠與重設動作也會跑。
  category: pitfall
  confidence: 0.9
  created_at: 2026-10-08
  context: SPEC-065 新增第二個 feature（版本號與建置識別）時，另一個步驟類別未限定範圍的 [BeforeFeature] 也替它啟動一個 CustomWebApplicationFactory，[AfterScenario] 也在每個場景後重設該類別的測試資料。
  anti_pattern: 以場景標籤篩選 feature hook（[BeforeFeature("SPEC-065")]）不會生效——標籤寫在場景上，不在 feature 上，hook 不執行，步驟取 FeatureContext 時丟 KeyNotFoundException。
  resolution: 類別層級 [Scope(Feature = …)]（會套用到類別內的 static feature hook）；[AfterFeature] 以 TryGetValue 取工廠再釋放，避免啟動失敗時再丟例外蓋掉真正原因。
  tags: [reqnroll, bdd, hooks]
  applicability:
    frameworks: [Reqnroll]
    universal: false
  validity:
    type: versioned
    version_bound: "Reqnroll 3.3.4"
  related: []
- id: MEM-2026-0004
  insight: Stryker.NET 5.0.0 在 xUnit v3（Microsoft Testing Platform）專案產生的變異分數不可信——vstest 執行器全判逾時，mtp 執行器會誤判 Killed；看分數前先抽查一個 Killed 變異。
  category: pitfall
  confidence: 0.9
  created_at: 2026-10-08
  context: 依 2026-10-08 裁決第 21 題試跑變異測試（backend/stryker-config.json，Core＋UnitTests）。
  anti_pattern: 預設執行器得 98.51%，看似很好，實際 Killed 0、596 個全是 Timeout；加 --test-runner mtp 得 82.48%、Survived 0，也像正常結果，但手動套用其中一個「Killed」變異後測試全過。
  resolution: 以報告的 status 分布判斷（Killed 為 0 或 Survived 為 0 都可疑），再挑一個 Killed 變異手動套用、直接 dotnet run 單元測試確認；同時做一個必定失敗的對照變異，證明手動流程有效。工具修正前不以分數為依據（DEF-021）。
  example:
    bad: "dotnet stryker  # 98.51%，全是 Timeout"
    good: "看 Killed/Survived/Timeout 分布＋手動套用變異驗證"
  tags: [stryker, mutation-testing, xunit-v3, mtp]
  applicability:
    frameworks: [Stryker.NET, xUnit v3]
    universal: false
  validity:
    type: versioned
    version_bound: "Stryker.NET 5.0.0"
  related: []
- id: MEM-2026-0005
  insight: Nuxt 4.6 在 pnpm＋Windows 下正式建置（nuxt build）後，每個頁面都回 500「Either manifest or precomputed data must be provided」；nuxt dev 與 Vitest 都正常，只有 .output 會壞。
  category: pitfall
  confidence: 0.85
  created_at: 2026-10-09
  context: 建立前端骨架 frontend/site（Nuxt 4.6.0、nitropack 2.13.4、pnpm 11.5.0、Node 24、Windows 11），以 node .output/server/index.mjs 做冒煙測試。
  anti_pattern: Nitro 把 nuxt runtime 外部化到 .output/server/node_modules/nuxt，nuxt/internal/precomputed 依 package exports 對到 dist/runtime/server/precomputed.js 空 stub，而不是建置產物。lint、typecheck、test 全綠也抓不到。
  resolution: nuxt.config.ts 加 nitro.externals.inline = ['nuxt'] 強制打包；建置後檢查 .output/server/node_modules 不含 nuxt，並實際啟動 .output 打首頁確認 200。
  example:
    bad: "nitro: {}  # .output/server/node_modules/nuxt 存在 → SSR 500"
    good: "nitro: { externals: { inline: ['nuxt'] } }"
  tags: [nuxt, nitro, pnpm, windows, build]
  applicability:
    frameworks: [Nuxt, Nitro]
    universal: false
  validity:
    type: versioned
    version_bound: "nuxt 4.6.0 / nitropack 2.13.4"
  related: []
- id: MEM-2026-0006
  insight: pnpm 在 node_modules 已存在時常回「Already up to date」，不會套用 pnpm-workspace.yaml 新加的 overrides，連刪掉 pnpm-lock.yaml 也不會重寫；要刪掉各層 node_modules 再 pnpm install。
  category: pitfall
  confidence: 0.85
  created_at: 2026-10-09
  context: 為修補 pnpm audit 的 simple-git 弱點，在 frontend/pnpm-workspace.yaml 加 overrides 後重裝（pnpm 11.5.0）。
  anti_pattern: 以為 override 已生效，audit 仍報同樣弱點；刪除 lockfile 後 pnpm 依 node_modules/.pnpm/lock.yaml 判定已最新，根目錄完全沒有 pnpm-lock.yaml，接著 pnpm audit 報 ERR_PNPM_AUDIT_NO_LOCKFILE。
  resolution: rm -rf node_modules */node_modules 後 pnpm install；用 ls node_modules/.pnpm | grep <套件> 確認實際版本，並確認 pnpm-lock.yaml 有產生。
  tags: [pnpm, overrides, lockfile]
  applicability:
    frameworks: [pnpm]
    universal: false
  validity:
    type: versioned
    version_bound: "pnpm 11.5.0"
  related: []
- id: MEM-2026-0007
  insight: 用 pnpm overrides 把遞移相依升主版本來修弱點前，要先確認上游的 import 方式；simple-git 4 拿掉 default export，@nuxt/devtools 3.x 的 import Git from 'simple-git' 在模組載入時就失敗，連 nuxt prepare 都跑不起來。
  category: pitfall
  confidence: 0.9
  created_at: 2026-10-09
  context: pnpm audit 報 simple-git（經 nuxt > @nuxt/devtools 3.4.2）Critical 弱點，修補版只有 4.x。
  anti_pattern: 只看到呼叫處包在 try/catch 就判斷升版無害，但 import 在模組頂層，錯誤發生在 try/catch 之外。
  resolution: override 前用 grep 找上游 dist 中所有 import 該套件的寫法並比對新版的 exports；不相容時改為停用使用它的功能（本例關閉 Nuxt devtools），或附理由列入 auditConfig.ignoreGhsas（DEF-024）。
  tags: [pnpm, overrides, security, nuxt]
  applicability:
    universal: true
  validity:
    type: permanent
  related: [MEM-2026-0006]
