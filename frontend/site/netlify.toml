# Netlify 部署設定（前台雛形展示用）。
# Netlify 專案設定：Base directory = frontend（pnpm workspace 根目錄，在此安裝與建置）、
# Package directory = frontend/site（本檔所在）。下方路徑相對於 Base directory。
# Nitro 偵測到 Netlify 建置環境會自動改用 netlify preset，SSR 與 server/api 假資料以 Netlify Functions 執行。

[build]
  command = "pnpm --filter @tcm-clinic/site build"
  publish = "site/dist"

[build.environment]
  # 與 frontend/package.json engines 一致；pnpm 版本由 packageManager 欄位經 Corepack 決定
  NODE_VERSION = "24"
